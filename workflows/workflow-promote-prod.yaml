id: a969fd03-e307-4396-a837-1890fbb8025b
name: plan-prod
tags: {}
jobs:
  - name: main
    description: Production Terraform plan and inspection guardrail.
    steps:
      - name: preflight
        description: Check required local tools, env vars, backend config, and AWS identity without printing secrets.
        task:
          type: model_method
          modelIdOrName: prod-shell
          methodName: execute
          inputs:
            run: bash scripts/prod-infra.sh preflight
            workingDir: .
            timeout: 120000
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: plan
        description: Initialize the S3 backend and create a saved production Terraform plan plus review text.
        task:
          type: model_method
          modelIdOrName: prod-shell
          methodName: execute
          inputs:
            run: bash scripts/prod-infra.sh plan
            workingDir: .
            timeout: 1200000
        dependsOn:
          - step: preflight
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: inspect-plan
        description: Fail on destructive changes, legacy hostname drift, unproxied DNS, missing CAA, or API Gateway default endpoint drift.
        task:
          type: model_method
          modelIdOrName: prod-shell
          methodName: execute
          inputs:
            run: bash scripts/prod-infra.sh inspect-plan
            workingDir: .
            timeout: 120000
        dependsOn:
          - step: plan
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: report
        description: Emit a concise local report with plan and inspection artifact paths.
        task:
          type: model_method
          modelIdOrName: prod-shell
          methodName: execute
          inputs:
            run: bash scripts/prod-infra.sh report
            workingDir: .
            timeout: 120000
        dependsOn:
          - step: inspect-plan
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
