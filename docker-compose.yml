services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: recipes
      POSTGRES_PASSWORD: recipes
      POSTGRES_USER: recipes
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U recipes -d recipes']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
